name: Build

on:
  - pull_request
  - push

jobs:
  msvc-32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Debug -G "NMake Makefiles" .
      - name: Build
        run: nmake

  msvc-64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" .
      - name: Build
        run: nmake

msys2-mingw32:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw32
          suppress-deprecation-warnings: msystem-mingw32
          install: cmake ninja
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Debug -G "Ninja" .
      - name: Build
        run: ninja

  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: cmake ninja
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -G "Ninja" .
      - name: Build
        run: ninja
